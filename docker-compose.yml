# --- Séance 3 : bloc commun aux trois services Airflow (ancres YAML) ---
x-airflow-commun: &airflow-commun
  build:
    context: ./airflow
  image: vitals-airflow:0.1
  environment: &airflow-env
    # Décisions
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://hs_user:hs_password@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    # Allègement mémoire (imposé)
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__SECRET_KEY: "s3-healthstream-tp"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ""
    # Connexion et variables versionnées (pas de clic dans l'interface)
    AIRFLOW_CONN_HEALTHSTREAM_PG: postgresql://hs_user:hs_password@postgres:5432/healthstream
    AIRFLOW_VAR_KAFKA_BOOTSTRAP: kafka:9092
    AIRFLOW_VAR_VITALS_TOPIC: mimic-vitals
    AIRFLOW_VAR_VITALS_GROUP: vitals-persister
    AIRFLOW_VAR_FENETRE_DUREE_S: "60"
    AIRFLOW_VAR_LAG_MAX: "200"
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./producer:/opt/airflow/producer:ro
  networks:
    - vitals-net

services:
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: vitals-kafka
    environment:
      # Identité KRaft : un seul nœud, broker + controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
      # Listeners : ce sur quoi le broker écoute
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      # Ce que le broker annonce aux clients (interne = nom de service)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Réplication : un seul broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Démarrage et garde-fous
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Données
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    ports:
      - "29092:29092"
    networks:
      - vitals-net

  postgres:
    image: cgr.dev/chainguard/postgres:latest@sha256:0926ac7262a2c1963179eb939cd5d610e1be3ecca90b4b5cad8db8df16fab87e
    container_name: vitals-postgres
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: healthstream
      POSTGRES_USER: hs_user
      POSTGRES_PASSWORD: hs_password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/init.sql:/var/lib/postgres/initdb/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hs_user -d healthstream"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vitals-net

  producer:
    build:
      context: ./producer
    image: vitals-producer:0.1
    container_name: vitals-producer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      VITALS_TOPIC: mimic-vitals
      NB_PATIENTS: "12"
      INTERVAL_S: "${INTERVAL_S:-1.0}"
    volumes:
      - vitals-logs:/app/logs
    networks:
      - vitals-net
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  consumer:
    build:
      context: ./consumer
    image: vitals-consumer:0.1
    # Pas de container_name, volontairement : --scale consumer=2 (partie 5).
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      VITALS_TOPIC: mimic-vitals
      CONSUMER_GROUP: vitals-persister
      AUTO_OFFSET_RESET: earliest
      BATCH_SIZE: "${BATCH_SIZE:-200}"
      BATCH_TIMEOUT_S: "5.0"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: healthstream
      PG_USER: hs_user
      PG_PASSWORD: hs_password
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vitals-net

  # --- Séance 3 : Airflow (LocalExecutor, sans Celery, Redis ni Flower) ---

  # 1. Crée la base "airflow" dans le PostgreSQL existant, une seule fois.
  airflow-db-init:
    image: cgr.dev/chainguard/postgres:latest@sha256:0926ac7262a2c1963179eb939cd5d610e1be3ecca90b4b5cad8db8df16fab87e
    container_name: vitals-airflow-db-init
    entrypoint: ["sh", "-c"]
    command:             # liste à UN élément : le tiret est indispensable
      - >
        psql -h postgres -U hs_user -d healthstream -tAc
        "SELECT 1 FROM pg_database WHERE datname='airflow'" | grep -q 1
        || psql -h postgres -U hs_user -d healthstream -c "CREATE DATABASE airflow OWNER hs_user"
    environment:
      PGPASSWORD: hs_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - vitals-net

  # 2. Migre le schéma de métadonnées et crée le compte admin, puis s'arrête.
  airflow-init:
    <<: *airflow-commun
    container_name: vitals-airflow-init
    command:
      - bash
      - -c
      - >
        set -e;
        airflow db migrate;
        airflow users create --username admin --password admin
        --firstname Ops --lastname ICU --role Admin
        --email admin@healthstream.local || true
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    restart: "no"

  # 3. Le seul service qui exécute réellement des tâches.
  airflow-scheduler:
    <<: *airflow-commun
    container_name: vitals-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 45s

  # 4. L'interface web.
  airflow-webserver:
    <<: *airflow-commun
    container_name: vitals-airflow-web
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  vitals-logs:
  kafka-data:
  pg-data:

networks:
  vitals-net:
    driver: bridge
